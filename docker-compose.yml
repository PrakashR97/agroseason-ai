# Base stack. Add docker-compose.local.yml (local Traefik, HTTP) or docker-compose.prod.yml
# (joins the VPS's existing Traefik, HTTPS). PostgreSQL and Redis publish NO ports and live on an
# internal-only network.
name: agroseason

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://agro:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/agroseason
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  TRUST_PROXY_HEADERS: "true"
  MEDIA_DIR: /data/media
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  SERPER_API_KEY: ${SERPER_API_KEY:-}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  RESEARCH_RATE_LIMIT_PER_HOUR: ${RESEARCH_RATE_LIMIT_PER_HOUR:-5}
  SERPER_DAILY_LIMIT: ${SERPER_DAILY_LIMIT:-100}
  OPENAI_DAILY_LIMIT: ${OPENAI_DAILY_LIMIT:-100}
  MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10}
  RESEARCH_CACHE_TTL_DAYS: ${RESEARCH_CACHE_TTL_DAYS:-30}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: agroseason
    volumes: [agro_pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agroseason"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [agro_redis:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    build: ./backend
    image: agroseason-backend:${TAG:-latest}
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed.run"]
    environment: *backend-env
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}

  api:
    image: agroseason-backend:${TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    volumes: [agro_media:/data/media]
    networks: [internal, edge]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    image: agroseason-backend:${TAG:-latest}
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment: *backend-env
    volumes: [agro_media:/data/media]
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=3).ping()"]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  web:
    build: ./frontend
    image: agroseason-web:${TAG:-latest}
    restart: unless-stopped
    networks: [edge]

networks:
  # internal: no external connectivity, hosts only db + redis traffic
  internal:
    internal: true
  edge: {}

volumes:
  agro_pgdata:
  agro_redis:
  agro_media:
