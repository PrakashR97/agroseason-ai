# Local full-stack test: Traefik on http://localhost:8088 (bound to 127.0.0.1 only).
services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=agroseason_edge
      - --entrypoints.web.address=:80
      - --ping=true
    ports: ["127.0.0.1:8088:80"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    labels:
      - traefik.enable=true
      - traefik.http.routers.agro-api.rule=PathPrefix(`/api`) || PathPrefix(`/media`) || Path(`/health`) || Path(`/docs`) || Path(`/openapi.json`)
      - traefik.http.routers.agro-api.priority=10
      - traefik.http.routers.agro-api.entrypoints=web
      - traefik.http.services.agro-api.loadbalancer.server.port=8000
  web:
    labels:
      - traefik.enable=true
      - traefik.http.routers.agro-web.rule=PathPrefix(`/`)
      - traefik.http.routers.agro-web.priority=1
      - traefik.http.routers.agro-web.entrypoints=web
      - traefik.http.services.agro-web.loadbalancer.server.port=8080
